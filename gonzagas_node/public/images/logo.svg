<svg width="120" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa8c2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="#fff" stroke-width="1"/>
  
  <!-- Letter G -->
  <text x="20" y="28" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Georgia, serif">G</text>
  
  <!-- Brand name -->
  <text x="45" y="16" fill="#2c2c2c" font-size="12" font-weight="600" font-family="Poppins, sans-serif">Gonzaga's</text>
  <text x="45" y="28" fill="#666" font-size="10" font-weight="400" font-family="Poppins, sans-serif">Art & Shine</text>
</svg>
